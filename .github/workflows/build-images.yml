name: Build LIVI OS images

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      board:
        description: Board to build
        type: choice
        options: [both, pi4, pi5]
        default: both
      livi_release:
        description: LIVI release tag to embed
        type: string
        default: nightly

concurrency:
  group: livi-images-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Validate and prepare release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.boards.outputs.matrix }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bc bison build-essential cpio file flex gettext git libncurses-dev \
            libssl-dev jq python3 rsync unzip wget xz-utils

      - name: Bootstrap Buildroot
        run: make bootstrap

      - name: Validate project
        run: make check

      - name: Test runtime recovery
        run: python3 support/test-runtime.py

      - name: Select boards
        id: boards
        env:
          BOARD: ${{ inputs.board || 'both' }}
        run: |
          case "$BOARD" in
            pi4) boards='["pi4"]' ;;
            pi5) boards='["pi5"]' ;;
            both) boards='["pi4","pi5"]' ;;
            *) echo "Unsupported board: $BOARD" >&2; exit 1 ;;
          esac
          echo "matrix={\"board\":$boards}" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --draft \
              --generate-notes \
              --title "LIVI OS $RELEASE_TAG" \
              --verify-tag
          fi

      - name: Prepare nightly release
        if: github.ref_name == 'main' && github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          if ! gh release view nightly >/dev/null 2>&1; then
            gh release create nightly --prerelease --title "Nightly Build" --notes "Rolling nightly build."
          else
            gh release edit nightly --notes "Rolling nightly build. Latest commit: \`$SHA\`"
          fi

  build:
    name: Build ${{ matrix.board }}
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      LIVI_CHANNEL: ${{ inputs.livi_release || 'nightly' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bc bison build-essential cpio file flex gettext git libncurses-dev \
            libssl-dev jq python3 rsync unzip wget xz-utils

      - name: Bootstrap Buildroot
        run: make bootstrap

      - name: Cache Buildroot downloads
        uses: actions/cache@v5.0.5
        with:
          path: buildroot/dl
          key: buildroot-dl-${{ runner.os }}-${{ matrix.board }}-${{ hashFiles('Makefile', 'configs/**', 'package/**/*.mk', 'package/**/*.hash', 'patches/**') }}
          restore-keys: |
            buildroot-dl-${{ runner.os }}-${{ matrix.board }}-

      - name: Cache compiler output
        uses: actions/cache@v5.0.5
        with:
          path: .buildroot-ccache/${{ matrix.board }}
          key: buildroot-ccache-${{ runner.os }}-${{ matrix.board }}-${{ github.sha }}
          restore-keys: |
            buildroot-ccache-${{ runner.os }}-${{ matrix.board }}-

      - name: Download and validate LIVI AppImage
        run: make fetch-livi

      - name: Build image
        run: make "${{ matrix.board }}"

      - name: Compress and checksum image
        env:
          IMAGE: livi-os-r${{ matrix.board }}.img
          BOARD: ${{ matrix.board }}
        run: |
          image_path="output/$BOARD/images/$IMAGE"
          test -s "$image_path"
          xz --threads=0 --compress --keep --force -6 "$image_path"
          sha256sum "$image_path.xz" > "$image_path.xz.sha256"

      - name: Upload flashable image
        uses: actions/upload-artifact@v6
        with:
          name: livi-os-r${{ matrix.board }}
          path: |
            output/${{ matrix.board }}/images/livi-os-r${{ matrix.board }}.img.xz
            output/${{ matrix.board }}/images/livi-os-r${{ matrix.board }}.img.xz.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload release assets
        if: github.ref_type == 'tag' || github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
          IMAGE: livi-os-r${{ matrix.board }}.img
          BOARD: ${{ matrix.board }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "output/$BOARD/images/$IMAGE.xz" \
            "output/$BOARD/images/$IMAGE.xz.sha256" \
            --clobber

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false
